<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BD BROTHERS 32 - AUTO</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}
body{background:#0a1020;color:#fff}
.top{padding:12px;background:#0f172a;text-align:center;border-bottom:2px solid #facc15}
.admin{background:#151b2e;margin:10px;padding:14px;border-radius:16px;border:2px solid #22d3ee}
.admin input, .admin select{padding:8px;margin:4px;border-radius:8px;background:#0f172a;color:#fff;border:1px solid #334155}
.btn{background:#22d3ee;color:#000;border:none;padding:10px 20px;border-radius:20px;font-weight:bold;cursor:pointer;margin-top:6px}
.group-box{background:#151b2e;border-radius:18px;padding:14px;margin:14px 12px;border:1px solid #2a344e}
.group-title{color:#facc15;font-size:18px;font-weight:bold;border-bottom:1px solid #2a344e;padding-bottom:6px;margin-bottom:8px}
.player-row{display:flex;justify-content:space-between;background:#1e293b;border-radius:12px;padding:10px;margin:5px 0;font-size:13px}
.pts{color:#22d3ee;font-weight:bold}
.final-box{background:#1a1020;border:2px solid #facc15;border-radius:16px;padding:12px;margin:10px}
</style>
</head>
<body>
<div class="top"><h2 style="color:#facc15">🏆 BD BROTHERS 32 - AUTO GOAL SYSTEM 🏆</h2><p style="font-size:11px;color:#94a3b8">শুধু গোল লিখো - Win/Draw/Point অটো</p></div>

<div class="admin">
<h3 style="color:#22d3ee">⚙️ RESULT ADD (শুধু গোল লিখো)</h3>
<select id="grp" onchange="loadPlayers()"><option>GROUP A</option><option>GROUP B</option><option>GROUP C</option><option>GROUP D</option><option>GROUP E</option><option>GROUP F</option><option>GROUP G</option><option>GROUP H</option></select><br>
<select id="p1"></select> <input type="number" id="g1" placeholder="গোল" style="width:55px"> VS <input type="number" id="g2" placeholder="গোল" style="width:55px"> <select id="p2"></select><br>
<button class="btn" onclick="addResult()">✅ ADD - অটো পয়েন্ট</button>
<p style="font-size:11px;color:#94a3b8;margin-top:5px">Juyel 2-1 Morsalin = Juyel 3pts অটো, Morsalin 0pts অটো | 1-1 Draw = দুজনের 1pt অটো</p>
</div>

<div id="allGroups"></div>

<script>
const groups = {
"GROUP A":["DX Morsalin 👑","Dip Debnath Ovi","Juyel Mia","একটা থাপ্পর দিমু"],
"GROUP B":["Abdur Rahman","Redowan Islam","Tanvir Ahamed","Oseem Mojumder"],
"GROUP C":["M D Porash","Sk Shakib","Abrar Rihad","Towhid Ahmed Sani"],
"GROUP D":["Risha Moni","Sheikh Rohul","Fara bi","Naim Ahmed Niloy"],
"GROUP E":["SHAMIM Hossain","Milu Rahman","Ewr Johirul Islam","P A R V E J"],
"GROUP F":["Roni Ahmed Nir","Rakib Ahmed","Sakib Belayet","SK Isteak"],
"GROUP G":["জিবন মিয়া","Shipon Al Hasan","Nazmul","NayemurRahman nayem"],
"GROUP H":["NayeEm Ul Islam","Sayem Ahmed","MH Munna","Md. Hanif"]
};
let stats={};
for(let g in groups){ groups[g].forEach(p=>stats[p]={W:0,D:0,L:0,GF:0,GA:0,PTS:0}); }

function renderGroups(){
let html='';
for(let g in groups){
html+=`<div class="group-box"><div class="group-title">${g}</div><div style="display:flex;justify-content:space-between;color:#64748b;font-size:10px;padding:4px"><span>PLAYER</span><span>W D L | GF-GA | PTS</span></div>`;
groups[g].forEach(p=>{
let s=stats[p];
html+=`<div class="player-row"><span>${p}</span><span data-p="${p}">${s.W}W ${s.D}D ${s.L}L | ${s.GF}-${s.GA} | <span class="pts">${s.PTS}</span></span></div>`;
});
html+=`</div>`;
}
document.getElementById('allGroups').innerHTML=html;
}
function loadPlayers(){
let g=document.getElementById('grp').value;
let p1=document.getElementById('p1'),p2=document.getElementById('p2');
p1.innerHTML='';p2.innerHTML='';
groups[g].forEach(p=>{
p1.innerHTML+=`<option>${p}</option>`;
p2.innerHTML+=`<option>${p}</option>`;
});
}
function addResult(){
let p1=document.getElementById('p1').value,p2=document.getElementById('p2').value;
let g1=parseInt(document.getElementById('g1').value),g2=parseInt(document.getElementById('g2').value);
if(p1===p2){alert('একই প্লেয়ার না ভাই!');return;}
if(isNaN(g1)||isNaN(g2)){alert('গোল লিখো!');return;}
stats[p1].GF+=g1;stats[p1].GA+=g2;
stats[p2].GF+=g2;stats[p2].GA+=g1;
if(g1>g2){stats[p1].W++;stats[p1].PTS+=3;stats[p2].L++;}
else if(g1<g2){stats[p2].W++;stats[p2].PTS+=3;stats[p1].L++;}
else{stats[p1].D++;stats[p2].D++;stats[p1].PTS++;stats[p2].PTS++;}
renderGroups();
loadPlayers();
document.getElementById('g1').value='';document.getElementById('g2').value='';
alert(`✅ ${p1} ${g1}-${g2} ${p2} - পয়েন্ট অটো যোগ হয়েছে!`);
}
renderGroups();loadPlayers();
</script>
</body>
</html>
