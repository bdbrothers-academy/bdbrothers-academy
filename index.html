 <!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BD BROTHERS 32 - FINAL LIVE</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}
body{background:#0a0f1f;color:#fff;padding-bottom:30px}
.top{padding:14px;background:#0f172a;text-align:center;border-bottom:3px solid #facc15}
.status{background:#002200;border:2px solid #00ff88;border-radius:14px;padding:10px;margin:12px;text-align:center;font-size:12px;color:#00ff88}
.group-box{background:#151b2e;border-radius:18px;padding:14px;margin:14px 12px;border:1px solid #2a344e}.group-title{color:#facc15;font-size:15px;font-weight:bold;border-bottom:1px solid #2a344e;padding-bottom:6px;margin-bottom:8px}
.player-row{display:flex;justify-content:space-between;background:#1e293b;border-radius:11px;padding:8px 10px;margin:4px 0;font-size:12px}.pts{color:#22d3ee;font-weight:bold}.mp{color:#000;background:#facc15;padding:2px 7px;border-radius:10px;font-size:10px;font-weight:bold}.first{background:#332a00!important;border:1px solid #facc15}
.lock{background:#1a1020;border:2px solid #facc15;border-radius:14px;padding:14px;margin:12px;text-align:center}
.admin{background:#151b2e;border:2px solid #22d3ee;border-radius:16px;padding:14px;margin:12px;display:none}
.admin input,.admin select{padding:8px;margin:4px 0;border-radius:8px;background:#0f172a;color:#fff;border:1px solid #334155;width:100%}
.admin .row{display:flex;gap:6px}
.btn{padding:8px 14px;border:none;border-radius:20px;font-weight:bold;cursor:pointer;font-size:12px}.btn-gold{background:#facc15;color:#000}.btn-cyan{background:#22d3ee;color:#000}.btn-red{background:#ff4444;color:#fff}
.tabs{display:flex;gap:6px;margin:12px;overflow-x:auto}.tab{padding:8px 14px;background:#1e293b;border-radius:20px;border:1px solid #334155;cursor:pointer;font-size:11px;white-space:nowrap}.tab.active{background:#facc15;color:#000;font-weight:bold}
.ko-box{background:#151b2e;border-radius:14px;padding:12px;margin:10px 12px;border:1px solid #2a344e}.match{background:#1e293b;border-radius:10px;padding:8px;margin:6px 0;font-size:12px}.winner{color:#22ff88;font-weight:bold}.scorer{font-size:10px;color:#facc15;margin-top:3px}
.match-list{background:#0f172a;border-radius:10px;padding:10px;margin-top:10px;border:1px dashed #334155}.match-item{background:#1e293b;padding:6px 8px;margin:4px 0;border-radius:8px;font-size:11px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap}
</style>
</head>
<body>
<div class="top"><h2>🏆 BD BROTHERS 32 🏆</h2><p style="font-size:10px;color:#22ff88">🟢 FINAL LIVE - TODAY DEADLINE</p></div>
<div class="status" id="status">🟢 LIVE Connected - সবাই দেখতে পাবে</div>

<div class="lock" id="lockBox"><h3 style="color:#facc15">🔒 ADMIN ONLY</h3><input type="password" id="pass" placeholder="Bdbrothers2026@"><button class="btn btn-gold" onclick="unlock()">🔓 UNLOCK</button></div>

<div class="admin" id="adminBox">
<h3 style="color:#22d3ee">⚙️ ফলাফল + কে কয় গোল</h3>
<select id="grp" onchange="loadP()"><option>GROUP A</option><option>GROUP B</option><option>GROUP C</option><option>GROUP D</option><option>GROUP E</option><option>GROUP F</option><option>GROUP G</option><option>GROUP H</option></select>
<div class="row"><select id="p1"></select><select id="p2"></select></div>
<div class="row"><input type="number" id="g1" placeholder="গোল"><input type="number" id="g2" placeholder="গোল"></div>
<input type="text" id="scorer" placeholder="Messi 2, Ronaldo 1">
<button class="btn btn-cyan" style="width:100%" onclick="addR()">ADD RESULT - সবাই LIVE দেখবে</button><br><br>
<div class="match-list" id="matchList"></div>
<button class="btn btn-gold" onclick="lock()">🔒 LOCK</button>
</div>

<div class="tabs">
<div class="tab active" onclick="showTab('groups',this)">GROUP</div>
<div class="tab" onclick="showTab('r16',this)">ROUND OF 16</div>
<div class="tab" onclick="showTab('qf',this)">QUARTER FINAL</div>
<div class="tab" onclick="showTab('sf',this)">SEMI FINAL</div>
<div class="tab" onclick="showTab('f',this)">FINAL</div>
</div>
<div id="tab-groups"></div>
<div id="tab-r16" style="display:none"></div>
<div id="tab-qf" style="display:none"></div>
<div id="tab-sf" style="display:none"></div>
<div id="tab-f" style="display:none"></div>

<script>
const BUCKET = "BDBROTHERS32FINAL2024DEADLINE2026";
const KEY = "bd32_final_data_v3";
const groups={"GROUP A":["DX Morsalin","Dip Debnath Ovi","Juyel Mia","একটা থাপ্পর দিমু"],"GROUP B":["Abdur Rahman","Redowan Islam","Tanvir Ahamed","Oseem Mojumder"],"GROUP C":["M D Porash","Sk Shakib","Abrar Rihad","Towhid Ahmed Sani"],"GROUP D":["Risha Moni","Sheikh Rohul","Fara bi","Naim Ahmed Niloy"],"GROUP E":["SHAMIM Hossain","Milu Rahman","Ewr Johirul Islam","P A R V E J"],"GROUP F":["Roni Ahmed Nir","Rakib Ahmed","Sakib Belayet","SK Isteak"],"GROUP G":["জিবন মিয়া","Shipon Al Hasan","Nazmul","NayemurRahman nayem"],"GROUP H":["Fk Faiag","Sayem Ahmed","MH Munna","Md. Hanif"]};

let matches = [];
let ko = {"R16":[],"QF":[],"SF":[],"F":[]};

async function saveAll(){
  document.getElementById('status').innerHTML='⏳ Saving LIVE...';
  localStorage.setItem('bd32_final_b',JSON.stringify(matches));
  localStorage.setItem('bd32_ko_b',JSON.stringify(ko));
  try{
    await fetch(`https://kvdb.io/${BUCKET}/${KEY}`, {method:'POST', body: JSON.stringify({matches, ko})});
    document.getElementById('status').innerHTML='✅ LIVE Saved - বন্ধুরা Chrome থেকেও দেখতে পাচ্ছে!';
  }catch(e){
    document.getElementById('status').innerHTML='✅ Local Saved - Net slow';
  }
  renderAll();
}
async function initDB(){
  try{
    let r = await fetch(`https://kvdb.io/${BUCKET}/${KEY}`);
    if(r.ok){
      let data = await r.json();
      if(data && data.matches){ matches = data.matches; ko = data.ko || ko; }
    }
  }catch(e){}
  let localM = JSON.parse(localStorage.getItem('bd32_final_b')||'[]');
  if(matches.length==0 && localM.length>0) matches = localM;
  renderAll();
  setInterval(async ()=>{
    try{
      let r = await fetch(`https://kvdb.io/${BUCKET}/${KEY}`);
      if(r.ok){ let data = await r.json(); if(data && data.matches && data.matches.length>matches.length){ matches=data.matches; ko=data.ko; renderAll(); } }
    }catch(e){}
  },5000);
}
function getStats(){let st={};for(let g in groups){groups[g].forEach(p=>st[p]={W:0,D:0,L:0,GF:0,GA:0,PTS:0,GD:0,MP:0});}matches.forEach(m=>{if(!st[m.p1]||!st[m.p2])return;st[m.p1].GF+=m.g1;st[m.p1].GA+=m.g2;st[m.p1].MP++;st[m.p2].GF+=m.g2;st[m.p2].GA+=m.g1;st[m.p2].MP++;if(m.g1>m.g2){st[m.p1].W++;st[m.p1].PTS+=3;st[m.p2].L++;}else if(m.g1<m.g2){st[m.p2].W++;st[m.p2].PTS+=3;st[m.p1].L++;}else{st[m.p1].D++;st[m.p2].D++;st[m.p1].PTS++;st[m.p2].PTS++;}});for(let p in st)st[p].GD=st[p].GF-st[p].GA;return st;}
function renderAll(){let st=getStats();let hg='';for(let g in groups){hg+=`<div class="group-box"><div class="group-title">${g}</div>`;let sorted=[...groups[g]].sort((a,b)=>st[b].PTS!==st[a].PTS?st[b].PTS-st[a].PTS:st[b].GD!==st[a].GD?st[b].GD-st[a].GD:st[b].GF-st[a].GF);sorted.forEach((p,i)=>{let s=st[p];hg+=`<div class="player-row ${i===0&&s.PTS>0?'first':''}"><span>${i+1}. ${p} <span class="mp">${s.MP}/3 ম্যাচ</span></span><span>${s.W}W ${s.D}D ${s.L}L | ${s.GF}-${s.GA} | <b class="pts">${s.PTS}</b></span></div>`;});hg+=`</div>`;}document.getElementById('tab-groups').innerHTML=hg;renderMatchList();}
function renderMatchList(){let html='<b style="color:#facc15">📋 সব ম্যাচ:</b><br>';matches.forEach((m,i)=>{html+=`<div class="match-item"><span>${i+1}. ${m.p1} ${m.g1}-${m.g2} ${m.p2} ${m.scorer?`<br><span style="color:#facc15">⚽ ${m.scorer}</span>`:''}</span><span><button class="btn btn-red" style="padding:4px 8px;font-size:10px" onclick="delMatch(${i})">❌</button></span></div>`;});document.getElementById('matchList').innerHTML=html;}
function showTab(t,el){document.querySelectorAll('[id^=tab-]').forEach(e=>e.style.display='none');document.getElementById('tab-'+t).style.display='block';document.querySelectorAll('.tab').forEach(e=>e.classList.remove('active'));if(el)el.classList.add('active');}
function loadP(){let g=document.getElementById('grp').value;let a=document.getElementById('p1'),b=document.getElementById('p2');a.innerHTML='';b.innerHTML='';groups[g].forEach(p=>{a.innerHTML+=`<option>${p}</option>`;b.innerHTML+=`<option>${p}</option>`;});}
function unlock(){if(document.getElementById('pass').value==="Bdbrothers2026@"){document.getElementById('adminBox').style.display='block';document.getElementById('lockBox').style.display='none';}else alert('❌ ভুল পাসওয়ার্ড!');}
function lock(){document.getElementById('adminBox').style.display='none';document.getElementById('lockBox').style.display='block';document.getElementById('pass').value='';}
function addR(){let p1=document.getElementById('p1').value,p2=document.getElementById('p2').value;let g1=parseInt(document.getElementById('g1').value),g2=parseInt(document.getElementById('g2').value);let scorer=document.getElementById('scorer').value;if(p1===p2){alert('একই প্লেয়ার না!');return;}if(isNaN(g1)||isNaN(g2)){alert('গোল লিখো!');return;}matches.push({p1,g1,p2,g2,scorer});saveAll();document.getElementById('scorer').value='';}
function delMatch(i){if(confirm('ডিলিট করবো?')){matches.splice(i,1);saveAll();}}
initDB();loadP();
</script>
</body>
</html>
