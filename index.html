 <!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BD BROTHERS 32 - AUTO LIVE</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}
body{background:#0a0f1f;color:#fff;padding-bottom:30px}
.top{padding:14px;background:#0f172a;text-align:center;border-bottom:3px solid #facc15}
.live-box{background:#002200;border:2px solid #00ff88;border-radius:14px;padding:10px;margin:12px;text-align:center;color:#00ff88;font-weight:bold;font-size:12px}
.group-box{background:#151b2e;border-radius:18px;padding:14px;margin:14px 12px;border:1px solid #2a344e}
.group-title{color:#facc15;font-size:15px;font-weight:bold;border-bottom:1px solid #2a344e;padding-bottom:6px;margin-bottom:8px}
.player-row{display:flex;justify-content:space-between;background:#1e293b;border-radius:11px;padding:8px 10px;margin:4px 0;font-size:12px}
.pts{color:#22d3ee;font-weight:bold}.mp{color:#000;background:#facc15;padding:2px 7px;border-radius:10px;font-size:10px;font-weight:bold}
.first{background:#332a00!important;border:1px solid #facc15}
.lock{background:#1a1020;border:2px solid #facc15;border-radius:14px;padding:14px;margin:12px;text-align:center}
.admin{background:#151b2e;border:2px solid #22d3ee;border-radius:16px;padding:14px;margin:12px;display:none}
.admin input,.admin select{padding:8px;margin:4px 0;border-radius:8px;background:#0f172a;color:#fff;border:1px solid #334155;width:100%}
.admin .row{display:flex;gap:6px}
.btn{padding:8px 14px;border:none;border-radius:20px;font-weight:bold;cursor:pointer;font-size:12px}
.btn-gold{background:#facc15;color:#000}.btn-cyan{background:#22d3ee;color:#000}.btn-red{background:#ff4444;color:#fff}
.match-item{background:#1e293b;padding:6px 8px;margin:4px 0;border-radius:8px;font-size:11px;display:flex;justify-content:space-between}
</style>
</head>
<body>
<div class="top"><h2>🏆 BD BROTHERS 32 🏆</h2><p style="font-size:11px;color:#22ff88">🟢 AUTO LIVE - তুমি আপডেট দিলে বন্ধুরা সাথে সাথে দেখবে</p></div>
<div class="live-box" id="liveStatus">⏳ LIVE Data লোড হচ্ছে...</div>
<div class="lock" id="lockBox"><h3 style="color:#facc15">🔒 ADMIN ONLY</h3><input type="password" id="pass" placeholder="Bdbrothers2026@"><br><br><button class="btn btn-gold" onclick="unlock()">🔓 UNLOCK</button></div>
<div class="admin" id="adminBox">
<h3 style="color:#22d3ee">⚙️ স্কোর যোগ করো (সবাই সাথে সাথে দেখবে)</h3>
<select id="grp" onchange="loadP()"><option>GROUP A</option><option>GROUP B</option><option>GROUP C</option><option>GROUP D</option><option>GROUP E</option><option>GROUP F</option><option>GROUP G</option><option>GROUP H</option></select>
<div class="row"><select id="p1"></select><select id="p2"></select></div>
<div class="row"><input type="number" id="g1" placeholder="গোল 1"><input type="number" id="g2" placeholder="গোল 2"></div>
<button class="btn btn-cyan" style="width:100%" onclick="addR()">✅ ADD & LIVE UPDATE</button>
<div id="matchList" style="margin-top:10px"></div>
<button class="btn btn-gold" onclick="lock()">🔒 LOCK</button>
</div>
<div id="tab-groups"></div>

<script>
const PANTRY_ID = "bdbrothers32-final-2026-v1";
const BASKET = "bd32live";
const API_URL = `https://getpantry.cloud/apiv1/pantry/${PANTRY_ID}/basket/${BASKET}`;

const groups={"GROUP A":["DX Morsalin","Dip Debnath Ovi","Juyel Mia","একটা থাপ্পর দিমু"],"GROUP B":["Abdur Rahman","Redowan Islam","Tanvir Ahamed","Oseem Mojumder"],"GROUP C":["M D Porash","Sk Shakib","Abrar Rihad","Towhid Ahmed Sani"],"GROUP D":["Risha Moni","Sheikh Rohul","Fara bi","Naim Ahmed Niloy"],"GROUP E":["SHAMIM Hossain","Milu Rahman","Ewr Johirul Islam","P A R V E J"],"GROUP F":["Roni Ahmed Nir","Rakib Ahmed","Sakib Belayet","SK Isteak"],"GROUP G":["জিবন মিয়া","Shipon Al Hasan","Nazmul","NayemurRahman nayem"],"GROUP H":["Fk Faiag","Sayem Ahmed","MH Munna","Md. Hanif"]};

let defaultMatches=[{"p1":"Towhid Ahmed Sani","g1":3,"p2":"Abrar Rihad","g2":1},{"p1":"Towhid Ahmed Sani","g1":4,"p2":"M D Porash","g2":1},{"p1":"Towhid Ahmed Sani","g1":5,"p2":"Sk Shakib","g2":2},{"p1":"Dip Debnath Ovi","g1":2,"p2":"একটা থাপ্পর দিমু","g2":0},{"p1":"Dip Debnath Ovi","g1":2,"p2":"DX Morsalin","g2":1},{"p1":"একটা থাপ্পর দিমু","g1":2,"p2":"Juyel Mia","g2":1},{"p1":"DX Morsalin","g1":2,"p2":"Juyel Mia","g2":2},{"p1":"Tanvir Ahamed","g1":4,"p2":"Abdur Rahman","g2":2},{"p1":"Tanvir Ahamed","g1":5,"p2":"Redowan Islam","g2":1},{"p1":"Tanvir Ahamed","g1":5,"p2":"Oseem Mojumder","g2":5},{"p1":"Oseem Mojumder","g1":4,"p2":"Redowan Islam","g2":1}];
let matches = [...defaultMatches];

async function loadLive(){
 try{
  let res = await fetch(API_URL);
  if(res.ok){
   let data = await res.json();
   if(data && data.matches && data.matches.length > 0){ matches = data.matches; document.getElementById('liveStatus').innerHTML = "🟢 LIVE CONNECTED - সবাই একই Score দেখছে - Auto Refresh 10s"; }
   else { document.getElementById('liveStatus').innerHTML = "🟡 প্রথমবার - Default Score দেখাচ্ছে"; }
  } else { document.getElementById('liveStatus').innerHTML = "🟡 Offline Mode - Default Score"; }
 } catch(e){ document.getElementById('liveStatus').innerHTML = "🟡 Offline Mode - Default Score"; }
 renderAll();
}
async function saveLive(){
 try{
  document.getElementById('liveStatus').innerHTML = "⏳ Saving & Broadcasting...";
  await fetch(API_URL, {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({matches:matches})});
  document.getElementById('liveStatus').innerHTML = "✅ LIVE SAVED! সব বন্ধুরা এখন দেখতে পাবে";
 } catch(e){ alert('Net Problem! কিন্তু Local এ Save হয়েছে'); }
 renderAll();
}
function getStats(){let st={};for(let g in groups){groups[g].forEach(p=>st[p]={W:0,D:0,L:0,GF:0,GA:0,PTS:0,GD:0,MP:0});}matches.forEach(m=>{if(!st[m.p1]||!st[m.p2])return;st[m.p1].GF+=m.g1;st[m.p1].GA+=m.g2;st[m.p1].MP++;st[m.p2].GF+=m.g2;st[m.p2].GA+=m.g1;st[m.p2].MP++;if(m.g1>m.g2){st[m.p1].W++;st[m.p1].PTS+=3;st[m.p2].L++;}else if(m.g1<m.g2){st[m.p2].W++;st[m.p2].PTS+=3;st[m.p1].L++;}else{st[m.p1].D++;st[m.p2].D++;st[m.p1].PTS++;st[m.p2].PTS++;}});for(let p in st)st[p].GD=st[p].GF-st[p].GA;return st;}
function renderAll(){let st=getStats();let hg='';for(let g in groups){hg+=`<div class="group-box"><div class="group-title">${g}</div>`;let sorted=[...groups[g]].sort((a,b)=>st[b].PTS!==st[a].PTS?st[b].PTS-st[a].PTS:st[b].GD!==st[a].GD?st[b].GD-st[a].GD:st[b].GF-st[a].GF);sorted.forEach((p,i)=>{let s=st[p];hg+=`<div class="player-row ${i===0&&s.PTS>0?'first':''}"><span>${i+1}. ${p} <span class="mp">${s.MP}/3</span></span><span>${s.W}W ${s.D}D | ${s.GF}-${s.GA} | <b class="pts">${s.PTS}</b></span></div>`;});hg+=`</div>`;}document.getElementById('tab-groups').innerHTML=hg;let html='<b style="color:#facc15">📋 সব ম্যাচ:</b><br>';matches.forEach((m,i)=>{html+=`<div class="match-item"><span>${m.p1} ${m.g1}-${m.g2} ${m.p2}</span><button class="btn btn-red" style="padding:4px 8px" onclick="delMatch(${i})">❌</button></div>`;});document.getElementById('matchList').innerHTML=html;}
function loadP(){let g=document.getElementById('grp').value;let a=document.getElementById('p1'),b=document.getElementById('p2');a.innerHTML='';b.innerHTML='';groups[g].forEach(p=>{a.innerHTML+=`<option>${p}</option>`;b.innerHTML+=`<option>${p}</option>`;});}
function unlock(){if(document.getElementById('pass').value==="Bdbrothers2026@"){document.getElementById('adminBox').style.display='block';document.getElementById('lockBox').style.display='none';}else alert('❌ ভুল পাসওয়ার্ড!');}
function lock(){document.getElementById('adminBox').style.display='none';document.getElementById('lockBox').style.display='block';}
function addR(){let p1=document.getElementById('p1').value,p2=document.getElementById('p2').value;let g1=parseInt(document.getElementById('g1').value),g2=parseInt(document.getElementById('g2').value);if(p1===p2||isNaN(g1)||isNaN(g2))return alert('ঠিক করে লিখো!');matches.push({p1,g1,p2,g2});saveLive();}
function delMatch(i){if(confirm('ডিলিট করবো?')){matches.splice(i,1);saveLive();}}
loadLive();loadP();
setInterval(loadLive,10000);
</script>
</body>
</html>
